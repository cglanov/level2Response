<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Level 2 Responders</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top-banner">
    <h1>Level 2 Responders</h1>
  </header>

  <main class="app-container">
    <!-- Panel 1: Students Awaiting Response -->
    <section class="panel" id="panel-students">
      <h2>Students awaiting Level 2 Response</h2>
      <div id="student-list" class="scrollable-list">
        <p class="status-msg">Loading active alerts...</p>
      </div>
    </section>

    <!-- Panel 2: Responders -->
    <section class="panel disabled" id="panel-responders">
      <h2>Responder:</h2>
      <div id="responder-list" class="scrollable-list">
        <p class="placeholder-text">Select a student first.</p>
      </div>
    </section>

    <!-- Panel 3: Response Status -->
    <section class="panel disabled" id="panel-status">
      <h2>Response Status</h2>
      <div class="status-content">
        <button id="resolve-btn" class="resolve-btn" disabled>
          Select student & responder
        </button>
        <div id="status-message" class="status-msg"></div>
      </div>
    </section>
  </main>

  <!-- Popup / Modal Dialog -->
  <div id="notes-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <h3>Resolve Level 2</h3>
      <label for="response-notes">Notes about response (optional):</label>
      <textarea id="response-notes" rows="4" placeholder="Enter optional notes here..."></textarea>
      
      <div class="modal-actions">
        <button id="modal-cancel-btn" class="btn btn-secondary">CANCEL</button>
        <button id="modal-submit-btn" class="btn btn-primary">SUBMIT</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
